[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitplot-designer"
version = "0.1.0"
description = "Reproducible split-plot design, validation, field-map rendering and power analysis for agricultural field trials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "uppercrusteve", email = "uppercrusteve@users.noreply.github.com" }]
keywords = ["split-plot", "experimental-design", "randomization", "power-analysis", "agronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Agriculture",
]
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
splitplot = "splitplot_designer.cli:main"

[project.urls]
Homepage = "https://github.com/uppercrusteve/splitplot-designer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splitplot_designer = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
